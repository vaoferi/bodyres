name: Bootstrap Start Here 0.2.0

on:
  push:
    branches:
      - nlm-44-start-here-0.2
    paths:
      - .github/workflows/bootstrap-start-here-0.2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout BodyRes branch
        uses: actions/checkout@v7
        with:
          ref: nlm-44-start-here-0.2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Checkout canonical Start Here 0.2.0
        uses: actions/checkout@v7
        with:
          repository: vaoferi/vaoferi-start-here
          ref: f73b116bed76d2c543d2d678964e5ad818ea0931
          path: .tmp-start-here
          fetch-depth: 1
      - name: Bootstrap local Start Here package
        run: python .tmp-start-here/scripts/vaoferi_sync.py bootstrap --target .
      - name: Verify bootstrapped package
        run: python .tmp-start-here/scripts/vaoferi_sync.py verify --target .
      - name: Remove temporary canonical checkout
        run: rm -rf .tmp-start-here
      - name: Commit bootstrapped package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md .agents/skills/vaoferi-* .vaoferi/manifest.json .vaoferi/verify.py
          git diff --cached --check
          git commit -m 'chore: bootstrap Vaoferi Start Here 0.2.0'
          git push origin HEAD:nlm-44-start-here-0.2
